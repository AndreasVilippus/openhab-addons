# Add-on
addon.caldav.name = CalDAV Binding
addon.caldav.description = Verbindet openHAB direkt mit CalDAV-Servern und stellt Kalendereinträge aus frei konfigurierbaren Zeiträumen bereit.

# Thing-Typen
thing-type.caldav.account.label = CalDAV-Konto
thing-type.caldav.account.description = Verbindet openHAB mit einem CalDAV-Server, erkennt verfügbare Kalender und verwaltet deren Synchronisation.
thing-type.caldav.calendar.label = CalDAV-Kalender
thing-type.caldav.calendar.description = Repräsentiert eine CalDAV Calendar Collection und stellt konkrete Termine des konfigurierten Zeitraums bereit.

# Konfigurationsgruppen
config.group.connection.label = Verbindung
config.group.connection.description = Verbindungs- und Anmeldeeinstellungen.
config.group.discovery.label = Erkennung
config.group.discovery.description = Einstellungen zur Kalendererkennung.
config.group.synchronization.label = Synchronisation
config.group.synchronization.description = Synchronisationsintervall und lokaler Synchronisationszeitraum.
config.group.advanced.label = Erweitert
config.group.advanced.description = Erweiterte Einstellungen.
config.group.calendar.label = Kalender
config.group.calendar.description = Einstellungen der Calendar Collection.
config.group.range.label = Zeitraum
config.group.range.description = Legt fest, welche konkreten Termine das Calendar Thing bereitstellt.

# Konto
config.account.url.label = Server-URL
config.account.url.description = Basis-URL des CalDAV-Servers oder ein bekannter CalDAV-Endpunkt.
config.account.username.label = Benutzername
config.account.username.description = Benutzername für die Anmeldung am CalDAV-Server.
config.account.password.label = Passwort
config.account.password.description = Passwort oder App-Passwort für die Anmeldung am CalDAV-Server.
config.account.authType.label = Authentifizierung
config.account.authType.description = Authentifizierungsmethode für den CalDAV-Server.
config.account.authType.option.AUTO = Automatisch
config.account.authType.option.BASIC = Basic-Authentifizierung
config.account.authType.option.DIGEST = Digest-Authentifizierung
config.account.requestTimeout.label = Anfrage-Timeout
config.account.requestTimeout.description = Maximale Wartezeit in Sekunden auf eine Serverantwort.
config.account.verifyCertificate.label = Zertifikat prüfen
config.account.verifyCertificate.description = Prüft das TLS-Zertifikat des CalDAV-Servers. Das Deaktivieren wird nicht empfohlen.
config.account.discoveryMode.label = Erkennungsmodus
config.account.discoveryMode.description = Legt fest, ob Kalenderinformationen automatisch erkannt oder direkt vorgegeben werden.
config.account.discoveryMode.option.AUTO = Automatisch
config.account.discoveryMode.option.DIRECT = Direkt
config.account.calendarHome.label = Calendar Home
config.account.calendarHome.description = Optional angegebene Calendar-Home-URL. Bei automatischer Erkennung leer lassen.
config.account.refreshInterval.label = Aktualisierungsintervall
config.account.refreshInterval.description = Intervall in Sekunden zwischen zwei Synchronisationsprüfungen.
config.account.syncMode.label = Synchronisationsmodus
config.account.syncMode.description = Legt die Synchronisationsmethode fest. Im automatischen Modus wird die beste vom Server unterstützte Methode verwendet.
config.account.syncMode.option.AUTO = Automatisch
config.account.syncMode.option.SYNC_TOKEN = Sync-Token
config.account.syncMode.option.ETAG = ETag
config.account.syncMode.option.FULL = Vollständige Synchronisation
config.account.maxPastDays.label = Vergangene Sync-Tage
config.account.maxPastDays.description = Anzahl vergangener Tage im lokalen Synchronisationsfenster.
config.account.maxFutureDays.label = Zukünftige Sync-Tage
config.account.maxFutureDays.description = Anzahl zukünftiger Tage im lokalen Synchronisationsfenster.
config.account.readOnly.label = Nur lesen
config.account.readOnly.description = Verhindert Änderungen am Kalender durch dieses Binding.

# Kalender
config.calendar.path.label = Kalenderpfad
config.calendar.path.description = Pfad oder URL der CalDAV Calendar Collection.
config.calendar.calendarId.label = Kalender-ID
config.calendar.calendarId.description = Stabile interne Kennung des Kalenders.
config.calendar.enabled.label = Aktiviert
config.calendar.enabled.description = Aktiviert Synchronisation und Terminverarbeitung für diesen Kalender.
config.calendar.rangeAnchor.label = Zeitraumbezug
config.calendar.rangeAnchor.description = Legt fest, ob Verschiebungen ab Tagesbeginn oder ab der aktuellen Uhrzeit berechnet werden.
config.calendar.rangeAnchor.option.TODAY = Heute
config.calendar.rangeAnchor.option.NOW = Aktuelle Uhrzeit
config.calendar.rangeStartOffset.label = Startverschiebung
config.calendar.rangeStartOffset.description = Verschiebung, an der der Ausgabezeitraum beginnt. Negative Werte wählen vergangene Tage.
config.calendar.rangeEndOffset.label = Endverschiebung
config.calendar.rangeEndOffset.description = Verschiebung für den letzten eingeschlossenen Tag des Ausgabezeitraums.
config.calendar.maxEvents.label = Maximale Terminanzahl
config.calendar.maxEvents.description = Maximale Anzahl konkreter Termine im konfigurierten Zeitraum.
config.calendar.includeCancelled.label = Abgesagte Termine einbeziehen
config.calendar.includeCancelled.description = Bezieht abgesagte Termine in die Ausgabe ein.

